name: Build & Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

jobs:
  build:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore BenkyoKanji/BenkyoKanji.csproj

      - name: Run Unit Tests
        run: dotnet test BenkyoKanji.Tests/BenkyoKanji.Tests.csproj -c Release

      - name: Publish Windows App
        run: |
          dotnet publish BenkyoKanji/BenkyoKanji.csproj -c Release -r win-x64 --self-contained false -o publish/BenkyoKanji-win-x64

      - name: Compress Release Package
        run: |
          Compress-Archive -Path publish/BenkyoKanji-win-x64/* -DestinationPath publish/BenkyoKanji-v1.0.0-win-x64.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BenkyoKanji-v1.0.0-win-x64
          path: publish/BenkyoKanji-v1.0.0-win-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/BenkyoKanji-v1.0.0-win-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
